[project]
name = "ddserver"
version = "0.4.0.dev0"
description = "A server-side application for dynamic DNS management."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Sven Reissmann", email = "sven@0x80.io" },
    { name = "Dustin Frisch", email = "fooker@lab.sh" },
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://ddserver.org"
Repository = "https://github.com/ddserver/ddserver"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
