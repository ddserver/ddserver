# Example configuration for ddserver.

[web]

# Secret key used to sign session cookies and the links in mails. Changing it ends
# all sessions, and links which were already sent stop working.
# Generate with: python3 -c 'import secrets; print(secrets.token_hex(32))'
#
secret_key = "change-me"

# Public address of ddserver, used for the links in mails.
#
base_url = "https://ddserver.example.org"

# Number of reverse proxies in front of ddserver (usually 0 or 1). ddserver
# takes the client address and the scheme from their X-Forwarded-* headers.
# Set this only behind a proxy: otherwise clients could fake their address.
#
# proxies = 0


[database]

# Database URL in SQLAlchemy format. For SQLite, four slashes give an absolute
# path, three a path relative to the working directory (e.g. for development).
#
# url = "sqlite:////var/lib/ddserver/ddserver.db"


[passwords]

# Minimum length of new passwords for users and hosts.
#
# min_length = 10


[hosts]

# Names which users cannot register, in any zone.
#
# reserved = ["www", "mail"]

# Number of hostnames a user can have.
# This can be changed on a per-user basis in the webui.
#
# default_limit = 5


[dns]

# IP address of the primary DNS server, which has to accept dynamic updates
# (RFC 2136) signed with the key below. Without a server, nothing is published.
#
# server = "192.0.2.53"
# port = 53

# TSIG key. The secret is base64 encoded.
#
# key_name = "ddserver"
# key_secret = ""
# key_algorithm = "hmac-sha256"

# TTL of the published records, in seconds.
#
# ttl = 60


[mail]

# Sender of all mails. Without a sender, no mail can be sent.
# Test with: ddserver mail test <address>
#
# sender = "ddserver@example.org"

# SMTP server. For `security`, use `starttls` (usually port 587),
# `tls` (usually port 465) or `none`.
#
# host = "localhost"
# port = 587
# security = "starttls"

# Login at the SMTP server.
# Leave username empty if you do not need to log in.
#
# username = ""
# password = ""
