{% extends "base.html" %}

{% block content %}
  <div class="row">
    <div class="col-md-12"><h1>User management</h1></div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Created</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
            <tr>
              <td>{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.created.strftime('%Y-%m-%d') }}</td>
              <td>{{ 'Admin' if user.admin else 'User' }}</td>
              <td>{{ user.status.value }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
