{% extends "base.html" %}

{% block content %}
  <div class="row">
    <div class="col-md-12"><h1>Password recovery</h1></div>
  </div>

  <div class="row">
    <div class="col-md-8">
      <p>
        Enter your username or email address. We will email you with a link
        to choose a new password.
      </p>
    </div>

    <div class="col-md-4">
      <div class="box">
        <form action="{{ url_for('auth.lostpass_post') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="login">Username or email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input class="form-control" type="text" id="login" name="login"
                     autocomplete="username" required>
            </div>
          </div>
          <a class="btn btn-secondary" href="{{ url_for('public.index') }}">Cancel</a>
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
